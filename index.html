<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<div class="board">

  <div class="engraving-layer">
    <div class="row row-surname">
      <span class="slot" data-letter="З">З</span>
      <span class="slot" data-letter="а">а</span>
      <span class="slot" data-letter="с">с</span>
      <span class="slot" data-letter="е">е</span>
      <span class="slot" data-letter="д">д</span>
      <span class="slot" data-letter="а">а</span>
      <span class="slot" data-letter="т">т</span>
      <span class="slot" data-letter="е">е</span>
      <span class="slot" data-letter="л">л</span>
      <span class="slot" data-letter="е">е</span>
      <span class="slot" data-letter="в">в</span>
    </div>
    <div class="row row-name">
      <span class="slot" data-letter="Е">Е</span>
      <span class="slot" data-letter="г">г</span>
      <span class="slot" data-letter="о">о</span>
      <span class="slot" data-letter="р">р</span>
    </div>
  </div>

  <div class="magnet" data-letter="З">З</div>
  <div class="magnet" data-letter="а">а</div>
  <div class="magnet" data-letter="с">с</div>
  <div class="magnet" data-letter="е">е</div>
  <div class="magnet" data-letter="д">д</div>
  <div class="magnet" data-letter="а">а</div>
  <div class="magnet" data-letter="т">т</div>
  <div class="magnet" data-letter="е">е</div>
  <div class="magnet" data-letter="л">л</div>
  <div class="magnet" data-letter="е">е</div>
  <div class="magnet" data-letter="в">в</div>
  <div class="magnet" data-letter="Е">Е</div>
  <div class="magnet" data-letter="г">г</div>
  <div class="magnet" data-letter="о">о</div>
  <div class="magnet" data-letter="р">р</div>

  
</div>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
